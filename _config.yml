# General Settings
title: "First Families of the United States"
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  A Travel Blog for the First Familes in the United States log." You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
url: "https://FirstFamiliesUS.github.io"
baseurl: "/FirstFamilies"
logo: "/assets/images/logo.png"
twitter_username: jekyllrb
github_username:  jekyll
og_image: "/assets/images/logo.png"
favicon: "/assets/img/favicon.webp"
# Sitewide Logo
logo_1x: "/assets/images/logo.png"

# Seo Meta Settings
meta_og_image: "/assets/img/meta-image.webp"  # Image used for OpenGraph (Facebook, LinkedIn)
meta_twitter_image: "/assets/img/meta-image.webp"  # Image used for Twitter cards

# Site Wide Theme Color Setting
color_scheme: # Aqua Fuchsia Grape Green Leaf Navy Orange Pink Purple Red Sky Violet Yellow

# Site Wide Theme Font Setting
font_scheme: # dm , space , thicccboi , urbanist

# Site Wide Font Icons Setting (FontAwesome, Unicons, etc.)
font_icons_scheme: # https://unicons.iconscout.com/release/v4.0.8/css/line.css

# Build settings
markdown: kramdown
#permalink: /blog/:year/:month/:day/:title/
permalink: /blog/:title/
sass:
  style: compressed
  sass_dir: _sass
  # Enable source maps in development, disable in production
  sourcemap: never # Valid values: 'development' (default), 'always', 'never'
  

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-watch
  - jekyll-toc   #Documentation TOC 

# TOC Settings for documentation
toc:
  min_level: 2
  max_level: 3
  list_class: 'list-unstyled fs-sm lh-sm text-reset'
  sublist_class: 'list-unstyled pt-2 ps-2 fs-sm lh-sm text-reset'
  item_class: 'nav-link scroll'
  item_prefix: 'snippet-'
  ordered: false
  no_toc_section_class: 'no-toc'
  numbered_items: true
  auto_ids: true
  sanitize: false

# Pagination
pagination:
  enabled: true
  debug: true
  collections:
    - name: 'projects'
      per_page: 9
      permalink: '/projects/page:num/'
      title: ':title - Page :num'
    - name: 'posts'
      per_page: 6
      permalink: '/blog/page:num/'
      title: ':title - Page :num'

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/
  authors:
    output: true
    permalink: /authors/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      

# Exclude from processing and watching
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - README.md
  - package.json
  - package-lock.json
  - yarn.lock
  - tmp
  - .git
  - .github
  - .vscode

# LiveReload settings
livereload_max_delay: 5
livereload_min_delay: 2.5

# Tags settings
tag_page_layout: blog/tag_page
tag_page_dir: tag

# Archive settings
jekyll-archives:
  enabled:
    - year
    - month
    - tags
    - categories
  layouts:
    year: blog/archive-year
    month: blog/archive-month
    tag: blog/archive-tag
    category: blog/archive-category
  permalinks:
    year: '/blog/:year/'
    month: '/blog/:year/:month/'
    tag: '/blog/tag/:name/'
    category: '/blog/category/:name/'
