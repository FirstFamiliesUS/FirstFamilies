backend:
  name: github
  repo: FirstFamiliesUS/FirstFamilies
  branch: main

# This saves uploaded images directly to your assets folder
media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # 1. ANCESTORS COLLECTION
  - name: "ancestors"
    label: "Ancestors"
    folder: "ancestors"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Name/Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", hint: "e.g., /ancestors/kenner/david/" }
      - { label: "Header Image", name: "image", widget: "image", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

  # 2. EVENTS COLLECTION
  - name: "events_md"
    label: "Events - Maryland"
    folder: "content/events/maryland"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events_va"
    label: "Events - Virginia"
    folder: "content/events/virginia"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events_dc"
    label: "Events - Washington DC"
    folder: "content/events/washington_dc/general"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events_dc_christmas"
    label: "Events - DC (Christmas)"
    folder: "content/events/washington_dc/christmas"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }