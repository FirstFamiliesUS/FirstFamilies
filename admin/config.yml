backend:
  name: github
  repo: FirstFamiliesUS/FirstFamilies
  branch: main

# This saves uploaded images directly to your assets folder
media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # 1. ANCESTORS COLLECTION
  - name: "ancestors"
    label: "Ancestors"
    folder: "ancestors"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Name/Title", name: "title", widget: "string" }
      - { label: "Permalink (e.g., /ancestors/kenner/david/)", name: "permalink", widget: "string" }
      - { label: "Header Image", name: "image", widget: "image", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

  # 2. EVENTS COLLECTION
  - name: "events"
    label: "Events"
    folder: "events" # Adjust this path to your repository's structure
    create: true
    fields:
      - label: "Event Name"
        name: "title"
        widget: "string"
        hint: "e.g., Mount Vernon Revolutionary War Weekend or Wreaths Across America"
      
      # First Dropdown: State/Region
      - label: "Location"
        name: "location"
        widget: "select"
        options: ["Maryland", "Virginia", "Washington DC"]
      
      # Second Dropdown: Sub-category / Holiday
      - label: "Holiday Category"
        name: "holiday"
        widget: "select"
        options: ["None", "Christmas", "Memorial Day", "Independence Day"]
        hint: "Select Christmas for Wreaths Across America ceremonies"
        required: false
      
      - label: "Body"
        name: "body"
        widget: "markdown"
