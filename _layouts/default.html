<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e293b;
      color: #f8fafc;
    }
    .site-header {
      background-color: #0f172a;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .site-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
    }
    .site-logo {
      height: 42px;
      width: 42px;
      object-fit: contain;
      border-radius: 50%;
    }
    .nav-menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 25px;
      align-items: center;
    }
    .nav-menu a {
      color: #f8fafc;
      text-decoration: none;
      font-size: 1rem;
    }
    .dropdown, .nested-dropdown {
      position: relative;
    }
    .dropdown-menu, .nested-dropdown-menu {
      display: none;
      position: absolute;
      background-color: #0f172a;
      min-width: 180px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      list-style: none;
      padding: 8px 0;
      margin: 0;
      border-radius: 4px;
      z-index: 1000;
    }
    .nested-dropdown-menu {
      top: 0;
      left: 100%;
    }
    .dropdown:hover > .dropdown-menu,
    .nested-dropdown:hover > .nested-dropdown-menu {
      display: block;
    }
    .dropdown-menu a, .nested-dropdown-menu a {
      display: block;
      padding: 10px 16px;
      color: #ffffff;
      white-space: nowrap;
    }
    .dropdown-menu a:hover, .nested-dropdown-menu a:hover {
      background-color: #334155;
    }
    .main-content {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .main-content a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Logo" class="site-logo">
      <span>First Families of the United States</span>
    </a>
    <ul class="nav-menu">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li class="dropdown">
        <a href="#">Events &#9662;</a>
        <ul class="dropdown-menu">
          <li><a href="{{ '/content/events/maryland/' | relative_url }}">Maryland</a></li>
          <li><a href="{{ '/content/events/virginia/' | relative_url }}">Virginia</a></li>
          <li class="nested-dropdown">
            <a href="{{ '/events/washington-dc/' | relative_url }}">Washington DC &#9656;</a>
            <ul class="nested-dropdown-menu">
              <li><a href="{{ '/events/washington-dc/christmas/' | relative_url }}">Christmas</a></li>
            </ul>
          </li>
        </ul>
      </li>
      <li><a href="{{ '/resources/' | relative_url }}">Resources</a></li>
      <li><a href="{{ '/ancestors/' | relative_url }}">Ancestors</a></li>
    </ul>
  </header>

  <main class="main-content">
    {{ content }}
  </main>
</body>
</html>
