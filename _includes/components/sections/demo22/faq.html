<section class="wrapper bg-light">
  <div class="container pb-14 pb-md-17">
    <div class="col-xl-11 mx-auto">
      <div class="row gx-md-8 gx-xl-12 gy-10 mb-15">
        {% for item in page.faq.items %}
        <div class="col-lg-6">
          <div class="d-flex flex-row">
          <div>
            <span class="icon btn btn-sm btn-circle btn-primary pe-none me-5"><i class="uil uil-comment-exclamation"></i></span>
          </div>
          <div>
            <h4>{{ item.question }}</h4>
            <p class="mb-0">{{ item.answer }}</p>
          </div>
        </div>
      </div>
      <!-- /column -->
      {% endfor %}
    </div>
    <!-- /.row -->
    </div> <!-- This closes col-xl-11 mx-auto -->
  </div>
  <!-- /.container -->
</section>
<!-- /section -->
